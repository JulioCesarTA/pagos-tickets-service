name: ci
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: 'pdo, pdo_pgsql, mbstring, intl' }
      - run: composer install --no-interaction --prefer-dist
      - run: ./vendor/bin/phpunit
      - run: docker build -t pagos-tickets-service:${{ github.sha }} .
