name: cd
# Al hacer commit en main: construye la imagen EN EL PC (runner propio, usa el caché de Docker), la sube a GHCR
# y reinicia el servicio en su servidor por SSH. Requiere el runner encendido (Escritorio\iniciar-runners.bat) y Docker Desktop abierto.
# Secretos del repositorio: SSH_HOST, SSH_USER, SSH_KEY
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: cd
  cancel-in-progress: true
jobs:
  desplegar:
    runs-on: [self-hosted, pc-julio]
    defaults:
      run:
        shell: C:gitbashbinbash.exe --noprofile --norc -e -o pipefail {0}
    env:
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Login en GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Construir y subir la imagen
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr 'A-Z' 'a-z')
          IMG=ghcr.io/$OWNER/pagos-tickets-service
          docker build -t $IMG:latest -t $IMG:${{ github.sha }} --label org.opencontainers.image.source=https://github.com/${{ github.repository }} .
          docker push $IMG:latest
          docker push $IMG:${{ github.sha }}

      - name: Desplegar por SSH
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr 'A-Z' 'a-z')
          printf '%s\n' "$SSH_KEY" > key && chmod 600 key
          SSH="ssh -i key -o StrictHostKeyChecking=no -o ConnectTimeout=20 $SSH_USER@$SSH_HOST"
          echo "${{ secrets.GITHUB_TOKEN }}" | $SSH "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          $SSH "cd ~/comedor && docker compose --env-file .env --env-file .env.secrets --env-file .env.ec2 -f docker-compose.yml -f docker-compose.ec2.yml pull pagos-tickets-service && docker compose --env-file .env --env-file .env.secrets --env-file .env.ec2 -f docker-compose.yml -f docker-compose.ec2.yml up -d --no-deps pagos-tickets-service && docker image prune -f >/dev/null"
          rm -f key
